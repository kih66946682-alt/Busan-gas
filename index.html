<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 휘발유 최저가</title>
<style>
  :root {
    --bg: #eef2f6;
    --card: #ffffff;
    --ink: #14202b;
    --sub: #5b6b7a;
    --line: #dbe3ea;
    --best: #0a7d4f;
    --best-bg: #e3f5ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .meta { color: var(--sub); font-size: 14px; margin: 0 0 20px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  a.row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 12px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: inherit;
    text-decoration: none;
  }
  a.row:hover { border-color: var(--sub); }
  a.row:focus-visible { outline: 3px solid var(--best); outline-offset: 2px; }
  .rank { font-size: 15px; color: var(--sub); text-align: center; }
  .name { font-weight: 700; font-size: 16px; }
  .addr { font-size: 13px; color: var(--sub); }
  .price { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .price small { font-size: 12px; font-weight: 500; color: var(--sub); margin-left: 2px; }
  .best { background: var(--best-bg); border-color: var(--best); }
  .best .rank, .best .price { color: var(--best); }
  .note { margin-top: 20px; font-size: 13px; color: var(--sub); }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
</style>
</head>
<body>
<main>
  <h1>부산 휘발유 최저가</h1>
  <p class="meta" id="meta">불러오는 중...</p>
  <ol id="list"></ol>
  <p class="note">출처: 한국석유공사 오피넷. 실제 주유소 판매 가격과 차이가 있을 수 있어요. 주유소를 누르면 네이버 지도에서 열려요.</p>
</main>

<script>
  const meta = document.getElementById("meta");
  const list = document.getElementById("list");

  function showMessage(text) {
    meta.textContent = "";
    list.innerHTML = "";
    const li = document.createElement("li");
    li.className = "msg";
    li.textContent = text;
    list.appendChild(li);
  }

  async function load() {
    try {
      const res = await fetch("data/prices.json?t=" + Date.now());
      if (!res.ok) throw new Error("no data");
      const data = await res.json();

      const when = new Date(data.updated).toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "long",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
      meta.textContent = when + " 기준 · 싼 순서 " + data.stations.length + "곳";

      data.stations.forEach((s, i) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "row" + (i === 0 ? " best" : "");
        a.href = "https://map.naver.com/p/search/" + encodeURIComponent(s.name + " " + s.address);
        a.target = "_blank";
        a.rel = "noopener";

        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = i + 1;

        const info = document.createElement("div");
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = s.name;
        const addr = document.createElement("div");
        addr.className = "addr";
        addr.textContent = s.brand + " · " + s.address;
        info.append(name, addr);

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = s.price.toLocaleString("ko-KR");
        const unit = document.createElement("small");
        unit.textContent = "원";
        price.appendChild(unit);

        a.append(rank, info, price);
        li.appendChild(a);
        list.appendChild(li);
      });
    } catch (e) {
      showMessage("아직 가격 데이터가 없어요. GitHub의 Actions 탭에서 가격 업데이트를 한 번 실행한 뒤 다시 확인하세요.");
    }
  }
  load();
</script>
</body>
</html>
